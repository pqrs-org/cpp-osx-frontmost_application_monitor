name: example

targets:
  example:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: main.cpp
        compilerFlags:
          - -Wall
          - -Werror
          - "-std=c++23"
      - path: ../vendor/vendor/src/pqrs/osx/autorelease_pool/PQRSOSXAutoreleasePoolImpl.m
        compilerFlags:
          - -Wall
          - -Werror
          - -fno-objc-arc
      - path: ../src
    settings:
      base:
        OTHER_SWIFT_FLAGS: "-warnings-as-errors"
        SWIFT_OBJC_BRIDGING_HEADER: ../include/pqrs/osx/frontmost_application_monitor/impl/Bridging-Header.h
        SYSTEM_HEADER_SEARCH_PATHS:
          - ../include
          - ../vendor/vendor/include
